case_studies:
  - id: "drug-crime-network-bl1"
    title: "Drug Crime Network Investigation"
    description: "Identify repeat drug offenders and detect criminal networks in a target area"
    category: "Network Analysis"
    steps:
      - step: 1
        goal: "Identify crimes in target area"
        example_question: "Show crimes in BL1 area"
        pattern: "Geographic filtering with LOCATION_IN_AREA"
      - step: 2
        goal: "Find persons involved"
        example_question: "Who are involved in these crimes?"
        pattern: "PARTY_TO relationship traversal"
      - step: 3
        goal: "Identify repeat offenders"
        example_question: "Which of these people are repeat offenders?"
        pattern: "Aggregation with count > 1 threshold"
      - step: 4
        goal: "Detect criminal networks"
        example_question: "Are these repeat offenders connected to each other?"
        pattern: "KNOWS relationship network traversal"

  - id: "communication-suspicious-network"
    title: "Communication-Based Investigation"
    description: "Identify suspicious communication patterns linked to criminal activity"
    category: "Communication Analysis"
    steps:
      - step: 1
        goal: "Find high-frequency communications"
        example_question: "Which phone pairs communicate frequently?"
        pattern: "PhoneCall aggregation with call_count threshold"
      - step: 2
        goal: "Identify phone owners"
        example_question: "Who owns these phones?"
        pattern: "HAS_PHONE relationship lookup"
      - step: 3
        goal: "Cross-reference with crimes"
        example_question: "Which of these people are involved in crimes?"
        pattern: "PARTY_TO filtering on identified persons"

  - id: "area-crime-hotspot"
    title: "Area Crime Hotspot Analysis"
    description: "Identify high-crime areas and analyze patterns within them"
    category: "Geographic Analysis"
    steps:
      - step: 1
        goal: "Find highest crime areas"
        example_question: "Which area has the most crimes?"
        pattern: "Aggregation by AREA with count and ORDER BY"
      - step: 2
        goal: "Analyze crime types in hotspot"
        example_question: "What types of crimes occur in this area?"
        pattern: "Filter by area and group by crime type"
      - step: 3
        goal: "Identify repeat locations"
        example_question: "Which specific locations have multiple crimes?"
        pattern: "Group by Location within area, count > 1"

  - id: "drug-evidence-network-bl6"
    title: "Drug Evidence and Network Investigation (BL6)"
    description: "Investigate drug crimes in BL6 area, analyze evidence, identify suspect network, and detect criminal connections"
    category: "End-to-End Investigation"

    steps:
      - step: 1
        goal: "Identify high drug crime areas"
        example_question: "Which areas have the highest number of drug-related crimes?"
        pattern: "Aggregation by AREA using LOCATION_IN_AREA with count, ORDER BY DESC"

      - step: 2
        goal: "Filter active drug cases in BL6"
        example_question: "Find all drug-related crimes in BL6 area that are under investigation. Include persons, evidence, and officers."
        pattern: "Filter Crime by type + last_outcome + area, traverse PARTY_TO, INVOLVED_IN, INVESTIGATED_BY"

      - step: 3
        goal: "Retrieve evidence for a specific crime"
        example_question: "What evidence is associated with the crime having id '2dec74f10fd12d8dcb28cb05ff058b4e4134ecb58d0e515c888f0611ca794339'?"
        pattern: "Object → INVOLVED_IN → Crime filtering by exact id"

      - step: 4
        goal: "Check if suspect has multiple charges"
        example_question: "What crimes is Raymond Walker involved in?"
        pattern: "Person → PARTY_TO → Crime, return multiple records"

      - step: 5
        goal: "Find direct network of suspect"
        example_question: "Who are directly connected to Raymond Walker?"
        pattern: "Person → KNOWS / KNOWS_LW / KNOWS_PHONE / FAMILY_REL → Person"

      - step: 6
        goal: "Expand network to 2 hops"
        example_question: "Find people connected to Raymond Walker within 2 hops"
        pattern: "Multi-hop traversal (*1..2) on KNOWS-type relationships"

      - step: 7
        goal: "Identify criminal connections in network"
        example_question: "Which people in Raymond Walker's network are also involved in crimes?"
        pattern: "Traverse network → filter using PARTY_TO → Crime"

      - step: 8
        goal: "Focus on drug-related network"
        example_question: "Which people in Raymond Walker's network are involved in drug crimes?"
        pattern: "Network traversal + filter Crime.type = Drugs"

      - step: 9
        goal: "Link evidence across crimes"
        example_question: "Is the same evidence linked to multiple crimes?"
        pattern: "Object → INVOLVED_IN → multiple Crime nodes"

      - step: 10
        goal: "Build final case conclusion"
        example_question: "Summarize the investigation findings for Raymond Walker"
        pattern: "Combine crime, evidence, network, and repeat offender insights"
